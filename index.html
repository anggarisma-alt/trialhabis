<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Masa Trial Berakhir · Trial Ended</title>

  <!-- Koneksi awal lebih cepat ke backend GAS -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <main class="wrap">

    <header class="hero">
      <div class="hero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
      <h1 data-k="judul_id"></h1>
      <p class="en" lang="en" data-k="judul_en"></p>
    </header>

    <div class="divider" role="presentation"></div>

    <section aria-labelledby="ajakan">
      <h2 id="ajakan" data-k="ajakan_id"></h2>
      <p class="en" lang="en" data-k="ajakan_en"></p>

      <div class="plans">
        <!-- Kotak 1: Bulanan -->
        <a class="plan" id="plan-bulanan" href="#" target="_blank" rel="noopener noreferrer">
          <span class="plan-name">Bulanan / <span lang="en">Monthly</span></span>
          <span class="price-group">
            <span class="plan-old" aria-hidden="true">&nbsp;</span>
            <span class="plan-price" id="price-bulanan"></span>
          </span>
          <span class="plan-cta plan-cta-ghost">
            <span>Pilih paket / <span lang="en">Choose</span></span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>

        <!-- Kotak 2: Tahunan -->
        <a class="plan plan-featured" id="plan-tahunan" href="#" target="_blank" rel="noopener noreferrer">
          <span class="badge" id="badge-hemat" hidden></span>
          <span class="plan-name">Tahunan / <span lang="en">Yearly</span></span>
          <span class="price-group">
            <span class="plan-old"><s id="price-normal"></s></span>
            <span class="plan-price" id="price-tahunan"></span>
          </span>
          <span class="plan-cta">
            <span>Pilih paket / <span lang="en">Choose</span></span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </div>

      <p class="hint">Ketuk paket untuk memesan via WhatsApp / <span lang="en">Tap a plan to order via WhatsApp</span></p>
    </section>

    <div id="notice" class="notice" role="status" hidden>
      <span id="notice-text"></span>
      <button type="button" id="notice-retry" class="link-btn">Coba lagi / Retry</button>
    </div>

    <footer class="contact">
      <p class="contact-label">Hubungi / <span lang="en">Call</span></p>
      <a class="phone" id="phone" href="tel:">0895-2785-0069</a>
      <a class="wa-btn" id="wa-chat" href="#" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        Chat WhatsApp
      </a>
    </footer>

    <noscript>
      <p class="notice">Aktifkan JavaScript untuk melihat harga. / Enable JavaScript to see prices.<br>Hubungi / Call: 0895-2785-0069</p>
    </noscript>
  </main>
</body>
</html>
